name: rsc-observability

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 64M
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      TZ: Africa/Lagos
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-dineout_admin_2026}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/dineout-slo-dashboard.json
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}:${SMTP_PORT:-587}
      GF_SMTP_USER: ${SMTP_USER:-}
      GF_SMTP_PASSWORD: ${SMTP_PASS:-}
      GF_SMTP_FROM_ADDRESS: ${ALERT_SMTP_FROM:-noreply@rscdev.tech}
      GF_SMTP_FROM_NAME: "DineOut Reliability Alerts"
      GF_SMTP_SKIP_VERIFY: "true"
      ALERT_EMAIL_RECIPIENT: ${ALERT_EMAIL_RECIPIENT:-devops@rscdev.tech}
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 64M
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
