global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "dineout-api"
    metrics_path: "/api/v1/observability/metrics"
    static_configs:
      - targets: ["api:4000"]
        labels:
          app: "dineout-api"
          service: "api"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
