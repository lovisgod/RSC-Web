apiVersion: 1

contactPoints:
  - orgId: 1
    name: email-alerts
    receivers:
      - uid: dineout-email-contact
        type: email
        settings:
          addresses: $ALERT_EMAIL_RECIPIENT
          singleEmail: true

policies:
  - orgId: 1
    receiver: email-alerts
    group_by:
      - alertname
      - severity
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
