name: rsc-web-${DEPLOY_ENV:-development}

services:
  postgres:
    image: postgis/postgis:16-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rsc
      POSTGRES_USER: rsc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - rsc-postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rsc -d rsc"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - rsc-redis-data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10

  api-migrate:
    image: rsc-api-${DEPLOY_ENV:-development}:${APP_VERSION:-dokploy}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
      args:
        APP_VERSION: ${APP_VERSION:-dokploy}
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://rsc:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/rsc
      DATABASE_SSL: "false"
    command:
      [
        "node",
        "node_modules/typeorm/cli.js",
        "migration:run",
        "-d",
        "dist/src/database/data-source.js",
      ]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: rsc-api-${DEPLOY_ENV:-development}:${APP_VERSION:-dokploy}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
      args:
        APP_VERSION: ${APP_VERSION:-dokploy}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      APP_VERSION: ${APP_VERSION:-dokploy}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://dev.rscapp.xyz,https://admin-dev.rscapp.xyz}
      DATABASE_URL: postgresql://rsc:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/rsc
      DATABASE_SSL: "false"
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?PII_ENCRYPTION_KEY is required}
      PII_HASH_PEPPER: ${PII_HASH_PEPPER:?PII_HASH_PEPPER is required}
      OTP_PEPPER: ${OTP_PEPPER:?OTP_PEPPER is required}
      SMS_PROVIDER: ${SMS_PROVIDER:-noop}
      TERMII_BASE_URL: ${TERMII_BASE_URL:-https://v3.api.termii.com}
      TERMII_API_KEY: ${TERMII_API_KEY:-}
      TERMII_SENDER_ID: ${TERMII_SENDER_ID:-}
      TERMII_CHANNEL: ${TERMII_CHANNEL:-dnd}
      TERMII_TIMEOUT_MS: ${TERMII_TIMEOUT_MS:-10000}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-noop}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-RSC <onboarding@resend.dev>}
      RESEND_REPLY_TO: ${RESEND_REPLY_TO:-}
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  customer-web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-}
        APP_VERSION: ${APP_VERSION:-dokploy}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  central-admin:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.admin
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_URL:-}
        APP_VERSION: ${APP_VERSION:-dokploy}
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  rsc-postgres-data:
  rsc-redis-data:
