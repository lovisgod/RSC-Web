name: rsc-web-${DEPLOY_ENV:-development}

services:
  postgres:
    image: postgis/postgis:16-3.5-alpine
    restart: unless-stopped
    environment:
      TZ: Africa/Lagos
      POSTGRES_DB: rsc
      POSTGRES_USER: rsc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - rsc-postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rsc -d rsc"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      TZ: Africa/Lagos
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - rsc-redis-data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10

  api-migrate:
    image: rsc-api-${DEPLOY_ENV:-development}:${APP_VERSION:-dokploy}
    restart: "no"
    environment:
      TZ: Africa/Lagos
      NODE_ENV: production
      DEPLOY_ENV: ${DEPLOY_ENV:-development}
      DATABASE_URL: postgresql://rsc:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/rsc
      DATABASE_SSL: "false"
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?PII_ENCRYPTION_KEY is required}
      PII_HASH_PEPPER: ${PII_HASH_PEPPER:?PII_HASH_PEPPER is required}
      OTP_PEPPER: ${OTP_PEPPER:?OTP_PEPPER is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-604800}
      ADMIN_INACTIVITY_TIMEOUT_SECONDS: ${ADMIN_INACTIVITY_TIMEOUT_SECONDS:-1800}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      CUSTOMER_WEB_URL: ${CUSTOMER_WEB_URL:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:?PAYMENT_PROVIDER must be set}
      MOMENT_SECRET_KEY: ${MOMENT_SECRET_KEY:-}
      MOMENT_BASE_URL: ${MOMENT_BASE_URL:-https://api.momentpay.net}
      MOMENT_WEBHOOK_SECRET: ${MOMENT_WEBHOOK_SECRET:-}
    command:
      [
        "node",
        "node_modules/typeorm/cli.js",
        "migration:run",
        "-d",
        "dist/src/database/data-source.js",
      ]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: rsc-api-${DEPLOY_ENV:-development}:${APP_VERSION:-dokploy}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
      args:
        APP_VERSION: ${APP_VERSION:-dokploy}
    restart: unless-stopped
    environment:
      TZ: Africa/Lagos
      NODE_ENV: production
      DEPLOY_ENV: ${DEPLOY_ENV:-development}
      PORT: "4000"
      APP_VERSION: ${APP_VERSION:-dokploy}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://dev.rscdev.tech,https://admin-dev.rscdev.tech,https://outlet-admin-dev.rscdev.tech}
      DATABASE_URL: postgresql://rsc:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/rsc
      DATABASE_SSL: "false"
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?PII_ENCRYPTION_KEY is required}
      PII_HASH_PEPPER: ${PII_HASH_PEPPER:?PII_HASH_PEPPER is required}
      OTP_PEPPER: ${OTP_PEPPER:?OTP_PEPPER is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-604800}
      ADMIN_INACTIVITY_TIMEOUT_SECONDS: ${ADMIN_INACTIVITY_TIMEOUT_SECONDS:-1800}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      SMS_PROVIDER: ${SMS_PROVIDER:-noop}
      SLING_BASE_URL: ${SLING_BASE_URL:-https://app.sling.com.ng/api/v1}
      SLING_API_TOKEN: ${SLING_API_TOKEN:-}
      SLING_SENDER_ID: ${SLING_SENDER_ID:-}
      SLING_MESSAGE_TYPE: ${SLING_MESSAGE_TYPE:-transactional}
      SLING_TIMEOUT_MS: ${SLING_TIMEOUT_MS:-10000}
      TERMII_BASE_URL: ${TERMII_BASE_URL:-https://v3.api.termii.com}
      TERMII_API_KEY: ${TERMII_API_KEY:-}
      TERMII_SENDER_ID: ${TERMII_SENDER_ID:-}
      TERMII_CHANNEL: ${TERMII_CHANNEL:-dnd}
      TERMII_TIMEOUT_MS: ${TERMII_TIMEOUT_MS:-10000}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-noop}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-RSC <noreply@rscapp.xyz>}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      RESEND_REPLY_TO: ${RESEND_REPLY_TO:-}
      MEDIA_PROVIDER: ${MEDIA_PROVIDER:-noop}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-rsc}
      PUSH_PROVIDER: ${PUSH_PROVIDER:-noop}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      FIREBASE_PRIVATE_KEY_BASE64: ${FIREBASE_PRIVATE_KEY_BASE64:-}
      CUSTOMER_WEB_URL: ${CUSTOMER_WEB_URL:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:?PAYMENT_PROVIDER must be set}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_BASE_URL: ${PAYSTACK_BASE_URL:-https://api.paystack.co}
      MOMENT_SECRET_KEY: ${MOMENT_SECRET_KEY:-}
      MOMENT_BASE_URL: ${MOMENT_BASE_URL:-https://api.momentpay.net}
      MOMENT_WEBHOOK_SECRET: ${MOMENT_WEBHOOK_SECRET:-}
      MOMENT_WEBHOOK_REPLAY_LOG: ${MOMENT_WEBHOOK_REPLAY_LOG:-false}
      PLATFORM_COMMISSION_BPS: ${PLATFORM_COMMISSION_BPS:-1000}
      VAT_BPS: ${VAT_BPS:-750}
      DELIVERY_FEE_MINOR: ${DELIVERY_FEE_MINOR:-150000}
      ADDRESS_AUTOCOMPLETE_PROVIDER: ${ADDRESS_AUTOCOMPLETE_PROVIDER:-google}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      OPENCAGE_API_KEY: ${OPENCAGE_API_KEY:-}
      OPENCAGE_BASE_URL: ${OPENCAGE_BASE_URL:-}
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  customer-web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-${PUBLIC_GOOGLE_MAPS_API_KEY:-${GOOGLE_MAPS_API_KEY:-}}}
        APP_VERSION: ${APP_VERSION:-dokploy}
    restart: unless-stopped
    environment:
      TZ: Africa/Lagos
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-${PUBLIC_GOOGLE_MAPS_API_KEY:-${GOOGLE_MAPS_API_KEY:-}}}
      NEXT_GEOCODE_KEY: ${NEXT_GEOCODE_KEY:-}
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  central-admin:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.admin
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_URL:-}
        APP_VERSION: ${APP_VERSION:-dokploy}
    restart: unless-stopped
    environment:
      TZ: Africa/Lagos
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  outlet-admin:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.outlet-admin
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_URL:-}
        APP_VERSION: ${APP_VERSION:-dokploy}
    restart: unless-stopped
    environment:
      TZ: Africa/Lagos
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  rsc-postgres-data:
  rsc-redis-data:
