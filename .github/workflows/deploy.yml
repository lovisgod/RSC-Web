name: Build and deploy

on:
  push:
    branches:
      - dev
      - staging
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - development
          - staging
          - production

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm check

      - name: Test
        run: pnpm test

  prepare:
    name: Resolve deployment target
    runs-on: ubuntu-24.04
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      image_prefix: ${{ steps.target.outputs.image_prefix }}
      image_tag: ${{ steps.target.outputs.image_tag }}
      short_sha: ${{ steps.target.outputs.short_sha }}
    steps:
      - name: Resolve and validate target
        id: target
        env:
          DISPATCH_ENVIRONMENT: ${{ inputs.environment }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          case "$REF_NAME" in
            dev) expected_environment="development" ;;
            staging) expected_environment="staging" ;;
            main) expected_environment="production" ;;
            *)
              echo "Unsupported deployment branch: $REF_NAME" >&2
              exit 1
              ;;
          esac

          environment="$expected_environment"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            environment="$DISPATCH_ENVIRONMENT"
            if [[ "$environment" != "$expected_environment" ]]; then
              echo "Select $expected_environment when dispatching from $REF_NAME." >&2
              exit 1
            fi
          fi

          owner="$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          repository="$(printf '%s' "$REPOSITORY_NAME" | tr '[:upper:]' '[:lower:]')"
          short_sha="${COMMIT_SHA:0:12}"

          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "image_prefix=ghcr.io/$owner/$repository" >> "$GITHUB_OUTPUT"
          echo "image_tag=$environment" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.service }}
    needs:
      - verify
      - prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: ${{ needs.prepare.outputs.environment }}
    concurrency:
      group: publish-${{ needs.prepare.outputs.environment }}-${{ matrix.service }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: customer-web
            image_suffix: web
            dockerfile: deploy/docker/Dockerfile.web
            public_env_name: NEXT_PUBLIC_API_URL
          - service: central-admin
            image_suffix: admin
            dockerfile: deploy/docker/Dockerfile.admin
            public_env_name: VITE_API_BASE_URL

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.prepare.outputs.image_prefix }}-${{ matrix.image_suffix }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.image_tag }}
            type=raw,value=${{ needs.prepare.outputs.image_tag }}-${{ needs.prepare.outputs.short_sha }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=RSC ${{ matrix.service }}
            org.opencontainers.image.description=RSC multi-outlet food ordering platform

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          build-args: |
            ${{ matrix.public_env_name }}=${{ vars.PUBLIC_API_URL }}
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image_suffix }}-${{ needs.prepare.outputs.environment }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_suffix }}-${{ needs.prepare.outputs.environment }}
          provenance: mode=max
          sbom: true

  deploy:
    name: Deploy to ${{ needs.prepare.outputs.environment }}
    needs:
      - prepare
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ${{ needs.prepare.outputs.environment }}
      url: ${{ vars.WEB_URL }}
    concurrency:
      group: deploy-${{ needs.prepare.outputs.environment }}
      cancel-in-progress: false

    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Trigger Dokploy compose deployment
        env:
          DOKPLOY_BASE_URL: ${{ secrets.DOKPLOY_BASE_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          set -euo pipefail

          : "${DOKPLOY_BASE_URL:?DOKPLOY_BASE_URL is required}"
          : "${DOKPLOY_API_KEY:?DOKPLOY_API_KEY is required}"
          : "${DOKPLOY_COMPOSE_ID:?DOKPLOY_COMPOSE_ID is required}"

          curl \
            --fail-with-body \
            --retry 3 \
            --retry-all-errors \
            --request POST \
            --url "${DOKPLOY_BASE_URL%/}/api/compose.deploy" \
            --header "accept: application/json" \
            --header "content-type: application/json" \
            --header "x-api-key: ${DOKPLOY_API_KEY}" \
            --data "{\"composeId\":\"${DOKPLOY_COMPOSE_ID}\"}"

      - name: Wait for customer web
        env:
          HEALTH_URL: ${{ vars.WEB_HEALTH_URL }}
        run: bash scripts/wait-for-url.sh "$HEALTH_URL" "${{ github.sha }}" 36

      - name: Wait for central admin
        env:
          HEALTH_URL: ${{ vars.ADMIN_HEALTH_URL }}
        run: bash scripts/wait-for-url.sh "$HEALTH_URL" "" 36

      - name: Deployment summary
        env:
          ENVIRONMENT_NAME: ${{ needs.prepare.outputs.environment }}
          IMAGE_PREFIX: ${{ needs.prepare.outputs.image_prefix }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          WEB_URL: ${{ vars.WEB_URL }}
          ADMIN_URL: ${{ vars.ADMIN_URL }}
        run: |
          {
            echo "## Deployment complete"
            echo
            echo "- Environment: \`$ENVIRONMENT_NAME\`"
            echo "- Images: \`$IMAGE_PREFIX-{web,admin}:$IMAGE_TAG\`"
            echo "- Customer web: $WEB_URL"
            echo "- Central admin: $ADMIN_URL"
          } >> "$GITHUB_STEP_SUMMARY"
